<svg width="600" height="760" viewBox="0 0 600 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">After-hours midnight desktop</title>
  <desc id="description">A stacked neon desktop with a manifesto, midnight radio, and forty-seven open browser tabs.</desc>

  <defs>
    <style>
      .screen-sweep {
        animation: screen-sweep 7s linear infinite;
      }
      .cursor {
        animation: cursor-blink 1.05s steps(1, end) infinite;
      }
      .live {
        animation: live-pulse 1.65s ease-in-out infinite;
      }
      .eq {
        animation: equalize 1.25s ease-in-out infinite alternate;
        transform-box: fill-box;
        transform-origin: center bottom;
      }
      .eq-2 { animation-duration: 0.82s; animation-delay: -0.34s; }
      .eq-3 { animation-duration: 1.06s; animation-delay: -0.71s; }
      .eq-4 { animation-duration: 0.94s; animation-delay: -0.18s; }
      @keyframes screen-sweep {
        0% { opacity: 0; transform: translateY(-30px); }
        10% { opacity: 0.2; }
        88% { opacity: 0.1; }
        100% { opacity: 0; transform: translateY(700px); }
      }
      @keyframes cursor-blink {
        0%, 48% { opacity: 1; }
        49%, 100% { opacity: 0.12; }
      }
      @keyframes live-pulse {
        0%, 100% { fill: #71717A; opacity: 0.55; }
        50% { fill: #CAFF4A; opacity: 1; }
      }
      @keyframes equalize {
        from { transform: scaleY(0.42); opacity: 0.58; }
        to { transform: scaleY(1); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .screen-sweep,
        .cursor,
        .live,
        .eq {
          animation: none;
        }
      }
    </style>
    <linearGradient id="edge" x1="14" y1="12" x2="586" y2="748" gradientUnits="userSpaceOnUse">
      <stop stop-color="#61DAFB"/>
      <stop offset="0.38" stop-color="#A855F7"/>
      <stop offset="0.72" stop-color="#FF6B35"/>
      <stop offset="1" stop-color="#CAFF4A"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H600" stroke="#000000" stroke-opacity="0.2"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="760" rx="16" fill="#07080D"/>
  <rect width="600" height="760" rx="16" fill="url(#grid)"/>
  <rect x="7" y="7" width="586" height="746" rx="12" stroke="url(#edge)" stroke-width="2"/>
  <rect class="screen-sweep" x="9" y="20" width="582" height="2" rx="1" fill="#61DAFB" opacity="0"/>

  <g font-family="Consolas, 'Courier New', monospace" font-weight="700">
    <circle cx="32" cy="35" r="5" fill="#FF6B35"/>
    <circle cx="50" cy="35" r="5" fill="#F8D866"/>
    <circle cx="68" cy="35" r="5" fill="#61DAFB"/>
    <text x="89" y="41" fill="#A1A1AA" font-size="14" letter-spacing="1.5">NIGHT DESKTOP</text>
    <text x="567" y="41" fill="#CAFF4A" font-size="14" text-anchor="end">03:29 PKT</text>
  </g>
  <path d="M25 59H575" stroke="#FFFFFF" stroke-opacity="0.14" stroke-dasharray="4 7"/>

  <rect x="24" y="78" width="552" height="290" rx="9" fill="#0B0C13" stroke="#61DAFB" stroke-opacity="0.8"/>
  <rect x="24" y="78" width="552" height="42" rx="9" fill="#111722"/>
  <path d="M24 111H576" stroke="#61DAFB" stroke-opacity="0.35"/>
  <circle cx="45" cy="99" r="4" fill="#FF6B35"/>
  <circle cx="61" cy="99" r="4" fill="#F8D866"/>
  <circle cx="77" cy="99" r="4" fill="#61DAFB"/>
  <text x="98" y="104" fill="#A1A1AA" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700">manifesto.txt</text>
  <g font-family="Consolas, 'Courier New', monospace" font-weight="700">
    <text x="51" y="161" fill="#61DAFB" font-size="24">01  make it useful.</text>
    <text x="51" y="207" fill="#E4E4E7" font-size="24">02  make it clear.</text>
    <text x="51" y="253" fill="#D8B4FE" font-size="24">03  make it a little strange.</text>
    <text x="51" y="299" fill="#FF9A72" font-size="24">04  ship before the spell breaks.</text>
    <text x="51" y="344" fill="#CAFF4A" font-size="14">:wq  unsaved wonder: 0</text>
    <rect class="cursor" x="259" y="329" width="9" height="19" fill="#CAFF4A" filter="url(#glow)"/>
  </g>

  <rect x="24" y="390" width="552" height="153" rx="9" fill="#0D0B15" stroke="#A855F7" stroke-opacity="0.8"/>
  <rect x="24" y="390" width="552" height="38" rx="9" fill="#171221"/>
  <path d="M24 419H576" stroke="#A855F7" stroke-opacity="0.35"/>
  <text x="48" y="414" fill="#D8B4FE" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="1.5">MIDNIGHT FM</text>
  <text class="live" x="552" y="414" fill="#71717A" font-family="Consolas, 'Courier New', monospace" font-size="12" text-anchor="end">LIVE</text>
  <text x="49" y="460" fill="#E4E4E7" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700">RAIN ON GLASS</text>
  <g fill="#61DAFB">
    <rect class="eq eq-2" x="51" y="489" width="8" height="20" rx="2"/>
    <rect class="eq eq-3" x="68" y="478" width="8" height="42" rx="2"/>
    <rect class="eq eq-4" x="85" y="469" width="8" height="60" rx="2"/>
    <rect class="eq" x="102" y="483" width="8" height="32" rx="2"/>
    <rect class="eq eq-2" x="119" y="463" width="8" height="72" rx="2" filter="url(#glow)"/>
    <rect class="eq eq-3" x="136" y="477" width="8" height="44" rx="2"/>
    <rect class="eq eq-4" x="153" y="487" width="8" height="24" rx="2"/>
    <rect class="eq" x="170" y="472" width="8" height="54" rx="2"/>
    <rect class="eq eq-2" x="187" y="481" width="8" height="36" rx="2"/>
  </g>
  <text x="222" y="500" fill="#71717A" font-family="Consolas, 'Courier New', monospace" font-size="12">city hum / keyboard clicks</text>
  <path d="M222 517H538" stroke="#27272A" stroke-width="5" stroke-linecap="round"/>
  <path d="M222 517H396" stroke="#FF6B35" stroke-width="5" stroke-linecap="round"/>
  <circle cx="396" cy="517" r="6" fill="#FF6B35" filter="url(#glow)"/>

  <rect x="24" y="565" width="552" height="150" rx="9" fill="#0A0E12" stroke="#CAFF4A" stroke-opacity="0.75"/>
  <rect x="24" y="565" width="552" height="38" rx="9" fill="#14190E"/>
  <path d="M24 594H576" stroke="#CAFF4A" stroke-opacity="0.3"/>
  <text x="48" y="589" fill="#CAFF4A" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="1.4">TAB GRAVEYARD</text>
  <text x="552" y="589" fill="#FF9A72" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="end">47 OPEN</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="15">
    <text x="49" y="631" fill="#61DAFB">01</text>
    <text x="83" y="631" fill="#D4D4D8">docs</text>
    <text x="310" y="631" fill="#A855F7">03</text>
    <text x="344" y="631" fill="#D4D4D8">can-i-do-this</text>
    <text x="49" y="674" fill="#FF6B35">02</text>
    <text x="83" y="674" fill="#D4D4D8">one-more-idea</text>
    <text x="310" y="674" fill="#CAFF4A">04</text>
    <text x="344" y="674" fill="#D4D4D8">yes</text>
  </g>

  <g font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="700">
    <text x="25" y="739" fill="#61DAFB">localhost:3000</text>
    <text x="300" y="739" fill="#FF6B35" text-anchor="middle">battery: 4%</text>
    <text x="575" y="739" fill="#CAFF4A" text-anchor="end">sleep: deferred</text>
  </g>
  <rect width="600" height="760" rx="16" fill="url(#scanlines)"/>
</svg>
