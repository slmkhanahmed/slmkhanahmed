<svg xmlns="http://www.w3.org/2000/svg" width="132" height="48" viewBox="0 0 176 64" role="img" aria-labelledby="perfect-circle-title perfect-circle-desc">
  <title id="perfect-circle-title">PERFECT CIRCLE</title>
  <desc id="perfect-circle-desc">Coral retro browser badge with a hand-drawn ring around a target point and a slowly travelling status dot.</desc>
  <style>
    .signal{animation:drift 7.1s ease-in-out -4.6s infinite alternate}
    @keyframes drift{from{transform:translateX(0)}to{transform:translateX(19px)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
  <rect width="176" height="64" rx="3" fill="#05060A"/>
  <rect x="1" y="1" width="174" height="62" rx="2" fill="#180F0D" stroke="#FFAA8B" stroke-width="2"/>
  <path d="M3 61V3H173" fill="none" stroke="#FFE7DA" stroke-opacity=".55"/>
  <path d="M3 61H173V3" fill="none" stroke="#663B2C" stroke-width="2"/>
  <path d="M4 16H172" stroke="#FFAA8B" stroke-opacity=".42"/>
  <rect x="4" y="4" width="168" height="11" fill="#FFAA8B" fill-opacity=".08"/>
  <path d="M9 8H28M9 11H20" stroke="#FFAA8B" stroke-opacity=".6"/>
  <path d="M141 9H165" stroke="#FFAA8B" stroke-opacity=".2"/>
  <rect class="signal" x="142" y="7" width="4" height="4" fill="#FFAA8B"/>
  <circle cx="24" cy="40" r="14" fill="none" stroke="#FFAA8B" stroke-opacity=".25" stroke-dasharray="2 3"/>
  <path d="M31 29C39 33 37 47 28 51C17 56 10 46 12 37C14 27 24 24 31 29Z" fill="#FFAA8B" fill-opacity=".05" stroke="#FFE7DA" stroke-width="1.6"/>
  <circle cx="24" cy="40" r="2" fill="#FFAA8B"/>
  <path d="M44 23V55" stroke="#FFAA8B" stroke-opacity=".22"/>
  <text x="52" y="38" fill="#FFF8F3" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="700">PERFECT CIRCLE</text>
  <text x="52" y="51" fill="#FFAA8B" font-family="ui-monospace,Consolas,monospace" font-size="8" letter-spacing=".7">STEADY HANDS?</text>
</svg>
