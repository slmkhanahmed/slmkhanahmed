<svg xmlns="http://www.w3.org/2000/svg" width="132" height="48" viewBox="0 0 176 64" role="img" aria-labelledby="zoomquilt-title zoomquilt-desc">
  <title id="zoomquilt-title">ZOOMQUILT</title>
  <desc id="zoomquilt-desc">Violet retro browser badge with nested portals and a slowly travelling status dot.</desc>
  <style>
    .signal{animation:drift 8.2s ease-in-out -3.1s infinite alternate}
    @keyframes drift{from{transform:translateX(0)}to{transform:translateX(19px)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
  <rect width="176" height="64" rx="3" fill="#05060A"/>
  <rect x="1" y="1" width="174" height="62" rx="2" fill="#100D18" stroke="#BA91FF" stroke-width="2"/>
  <path d="M3 61V3H173" fill="none" stroke="#EDDEFF" stroke-opacity=".55"/>
  <path d="M3 61H173V3" fill="none" stroke="#473061" stroke-width="2"/>
  <path d="M4 16H172" stroke="#BA91FF" stroke-opacity=".42"/>
  <rect x="4" y="4" width="168" height="11" fill="#BA91FF" fill-opacity=".08"/>
  <path d="M9 8H28M9 11H20" stroke="#BA91FF" stroke-opacity=".6"/>
  <path d="M141 9H165" stroke="#BA91FF" stroke-opacity=".2"/>
  <rect class="signal" x="142" y="7" width="4" height="4" fill="#BA91FF"/>
  <rect x="10" y="26" width="28" height="28" fill="#BA91FF" fill-opacity=".06" stroke="#BA91FF"/>
  <rect x="15" y="31" width="18" height="18" fill="none" stroke="#BA91FF" stroke-opacity=".7"/>
  <rect x="20" y="36" width="8" height="8" fill="#E8D8FF"/>
  <path d="M10 26L20 36M38 26L28 36M10 54L20 44M38 54L28 44" stroke="#BA91FF" stroke-opacity=".45"/>
  <path d="M44 23V55" stroke="#BA91FF" stroke-opacity=".22"/>
  <text x="52" y="38" fill="#FBF6FF" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700" letter-spacing=".15">ZOOMQUILT</text>
  <text x="52" y="51" fill="#BA91FF" font-family="ui-monospace,Consolas,monospace" font-size="8" letter-spacing=".7">THERE IS NO BOTTOM</text>
</svg>
