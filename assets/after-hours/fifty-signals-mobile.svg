<svg width="600" height="910" viewBox="0 0 600 910" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Fifty more after-hours signals</title>
  <desc id="description">A mobile wall of fifty handmade old-web badges about midnight browsing, personal websites, open tabs, terminal sessions, and useful weirdness.</desc>

  <defs>
    <linearGradient id="frame" x1="10" y1="8" x2="590" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#61DAFB"/>
      <stop offset="0.28" stop-color="#A855F7"/>
      <stop offset="0.55" stop-color="#FF6B35"/>
      <stop offset="0.78" stop-color="#CAFF4A"/>
      <stop offset="1" stop-color="#F8D866"/>
    </linearGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <pattern id="scanlines" width="3" height="3" patternUnits="userSpaceOnUse">
      <path d="M0 2.5H600" stroke="#000000" stroke-opacity="0.2"/>
    </pattern>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#61DAFB" stop-opacity="0"/>
    </linearGradient>
    <style>
      .signal-glint {
        animation: signal-sweep 7.5s ease-in-out infinite;
      }
      .scan-layer {
        animation: scan-flicker 1.6s steps(2, end) infinite;
      }
      .status-live {
        animation: status-blink 2s steps(2, end) infinite;
      }
      @keyframes signal-sweep {
        0%, 14% { transform: translateX(0); }
        72%, 100% { transform: translateX(760px); }
      }
      @keyframes scan-flicker {
        0%, 74% { opacity: .76; }
        75%, 100% { opacity: 1; }
      }
      @keyframes status-blink {
        0%, 78% { opacity: 1; }
        79%, 100% { opacity: .45; }
      }
      @media (prefers-reduced-motion: reduce) {
        .signal-glint,
        .scan-layer,
        .status-live {
          animation: none !important;
        }
        .signal-glint {
          display: none;
        }
      }
    </style>

    <g id="cyan">
      <rect width="170" height="46" rx="2" fill="#081318" stroke="#61DAFB" stroke-width="1.5"/>
      <rect x="4" y="4" width="162" height="38" fill="none" stroke="#61DAFB" stroke-opacity="0.35"/>
      <path d="M9 37H161" stroke="#61DAFB" stroke-dasharray="3 4"/>
    </g>
    <g id="violet">
      <rect width="170" height="46" rx="2" fill="#120C1A" stroke="#A855F7" stroke-width="1.5"/>
      <path d="M7 7H163M7 39H163" stroke="#D8B4FE" stroke-opacity="0.45"/>
      <path d="M11 12L18 19L11 26L18 33" stroke="#A855F7"/>
      <path d="M159 12L152 19L159 26L152 33" stroke="#A855F7"/>
    </g>
    <g id="orange">
      <rect width="170" height="46" rx="2" fill="#160C08" stroke="#FF6B35" stroke-width="1.5"/>
      <rect x="5" y="5" width="160" height="36" fill="none" stroke="#FF9A72" stroke-opacity="0.5"/>
      <rect x="9" y="9" width="7" height="7" fill="#FF6B35"/>
      <rect x="154" y="30" width="7" height="7" fill="#FF6B35"/>
    </g>
    <g id="lime">
      <rect width="170" height="46" rx="2" fill="#0D1207" stroke="#CAFF4A" stroke-width="1.5"/>
      <path d="M5 5H20V9H35V5H50V9H65V5H80V9H95V5H110V9H125V5H140V9H165" stroke="#CAFF4A" stroke-opacity="0.65"/>
      <path d="M5 41H20V37H35V41H50V37H65V41H80V37H95V41H110V37H125V41H140V37H165" stroke="#CAFF4A" stroke-opacity="0.65"/>
    </g>
    <g id="gold">
      <rect width="170" height="46" rx="2" fill="#151007" stroke="#F8D866" stroke-width="1.5"/>
      <path d="M8 23H22M148 23H162" stroke="#FF6B35" stroke-width="2"/>
      <path d="M15 16V30M155 16V30" stroke="#A855F7" stroke-width="1.5"/>
      <rect x="4" y="4" width="162" height="38" fill="none" stroke="#F8D866" stroke-opacity="0.3"/>
    </g>
  </defs>

  <rect width="600" height="910" rx="14" fill="#07080D"/>
  <rect width="600" height="910" rx="14" fill="url(#grid)"/>
  <rect x="7" y="7" width="586" height="896" rx="10" stroke="url(#frame)" stroke-width="2"/>

  <g font-family="Consolas, 'Courier New', monospace" font-weight="700">
    <circle cx="25" cy="29" r="4" fill="#FF6B35"/>
    <circle cx="40" cy="29" r="4" fill="#F8D866"/>
    <circle cx="55" cy="29" r="4" fill="#61DAFB"/>
    <text x="74" y="34" fill="#E4E4E7" font-size="14" letter-spacing="1.5">50 MORE SIGNALS</text>
    <text class="status-live" x="574" y="34" fill="#71717A" font-size="11" text-anchor="end">01—50 / UNVERIFIED</text>
  </g>

