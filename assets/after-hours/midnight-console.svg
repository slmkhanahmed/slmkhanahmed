<svg width="1200" height="510" viewBox="0 0 1200 510" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">After-hours midnight desktop</title>
  <desc id="description">A neon desktop with a manifesto, midnight radio, and forty-seven open browser tabs.</desc>

  <defs>
    <linearGradient id="edge" x1="22" y1="18" x2="1177" y2="492" gradientUnits="userSpaceOnUse">
      <stop stop-color="#61DAFB"/>
      <stop offset="0.37" stop-color="#A855F7"/>
      <stop offset="0.72" stop-color="#FF6B35"/>
      <stop offset="1" stop-color="#CAFF4A"/>
    </linearGradient>
    <linearGradient id="manifesto" x1="90" y1="153" x2="597" y2="385" gradientUnits="userSpaceOnUse">
      <stop stop-color="#61DAFB"/>
      <stop offset="0.48" stop-color="#E4E4E7"/>
      <stop offset="1" stop-color="#D8B4FE"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H1200" stroke="#000000" stroke-opacity="0.2"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="510" rx="18" fill="#07080D"/>
  <rect width="1200" height="510" rx="18" fill="url(#grid)"/>
  <rect x="8" y="8" width="1184" height="494" rx="13" stroke="url(#edge)" stroke-width="2"/>

  <g font-family="Consolas, 'Courier New', monospace" font-weight="700">
    <circle cx="42" cy="39" r="5" fill="#FF6B35"/>
    <circle cx="60" cy="39" r="5" fill="#F8D866"/>
    <circle cx="78" cy="39" r="5" fill="#61DAFB"/>
    <text x="98" y="45" fill="#A1A1AA" font-size="14" letter-spacing="2">LOCALHOST / NIGHT DESKTOP</text>
    <text x="600" y="45" fill="#CAFF4A" font-size="14" text-anchor="middle" letter-spacing="2">03:29:41 PKT</text>
    <text x="1158" y="45" fill="#61DAFB" font-size="14" text-anchor="end" letter-spacing="2">PACKETS: 108 / LOST: 0</text>
  </g>
  <path d="M30 62H1170" stroke="#FFFFFF" stroke-opacity="0.13" stroke-dasharray="4 7"/>

  <g filter="url(#shadow)">
    <rect x="34" y="82" width="650" height="360" rx="10" fill="#0B0C13" stroke="#61DAFB" stroke-opacity="0.75"/>
    <rect x="34" y="82" width="650" height="43" rx="10" fill="#111722"/>
    <path d="M34 115H684" stroke="#61DAFB" stroke-opacity="0.35"/>
    <circle cx="56" cy="103" r="4.5" fill="#FF6B35"/>
    <circle cx="73" cy="103" r="4.5" fill="#F8D866"/>
    <circle cx="90" cy="103" r="4.5" fill="#61DAFB"/>
    <text x="112" y="108" fill="#A1A1AA" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700">~/after-hours/manifesto.txt</text>

    <g font-family="Consolas, 'Courier New', monospace">
      <text x="62" y="166" fill="#52525B" font-size="17">01</text>
      <text x="62" y="217" fill="#52525B" font-size="17">02</text>
      <text x="62" y="268" fill="#52525B" font-size="17">03</text>
      <text x="62" y="319" fill="#52525B" font-size="17">04</text>
      <text x="104" y="166" fill="url(#manifesto)" font-size="28" font-weight="700">make it useful.</text>
      <text x="104" y="217" fill="url(#manifesto)" font-size="28" font-weight="700">make it clear.</text>
      <text x="104" y="268" fill="url(#manifesto)" font-size="28" font-weight="700">make it a little strange.</text>
      <text x="104" y="319" fill="#FF9A72" font-size="28" font-weight="700">ship before the spell breaks.</text>
      <text x="62" y="376" fill="#71717A" font-size="15">:wq</text>
      <text x="104" y="376" fill="#CAFF4A" font-size="15">unsaved wonder: 0</text>
      <rect x="301" y="359" width="10" height="21" fill="#CAFF4A" filter="url(#glow)"/>
      <text x="62" y="415" fill="#52525B" font-size="13">UTF-8</text>
      <text x="615" y="415" fill="#52525B" font-size="13" text-anchor="end">4L, 101C</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="640" y="98" width="526" height="181" rx="10" fill="#0D0B15" stroke="#A855F7" stroke-opacity="0.8"/>
    <rect x="640" y="98" width="526" height="39" rx="10" fill="#171221"/>
    <path d="M640 128H1166" stroke="#A855F7" stroke-opacity="0.35"/>
    <circle cx="661" cy="117" r="4" fill="#FF6B35"/>
    <circle cx="677" cy="117" r="4" fill="#F8D866"/>
    <circle cx="693" cy="117" r="4" fill="#A855F7"/>
    <text x="715" y="122" fill="#D8B4FE" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="1.5">MIDNIGHT FM</text>
    <text x="1138" y="122" fill="#71717A" font-family="Consolas, 'Courier New', monospace" font-size="12" text-anchor="end">LIVE</text>

    <text x="670" y="167" fill="#E4E4E7" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700">RAIN ON GLASS</text>
    <text x="1138" y="167" fill="#71717A" font-family="Consolas, 'Courier New', monospace" font-size="12" text-anchor="end">city hum / keyboard clicks</text>
    <g fill="#61DAFB">
      <rect x="671" y="203" width="7" height="16" rx="2"/>
      <rect x="686" y="194" width="7" height="34" rx="2"/>
      <rect x="701" y="184" width="7" height="54" rx="2"/>
      <rect x="716" y="198" width="7" height="26" rx="2"/>
      <rect x="731" y="178" width="7" height="66" rx="2"/>
      <rect x="746" y="190" width="7" height="42" rx="2"/>
      <rect x="761" y="201" width="7" height="20" rx="2"/>
      <rect x="776" y="187" width="7" height="48" rx="2"/>
      <rect x="791" y="174" width="7" height="74" rx="2" filter="url(#glow)"/>
      <rect x="806" y="194" width="7" height="34" rx="2"/>
      <rect x="821" y="182" width="7" height="58" rx="2"/>
      <rect x="836" y="199" width="7" height="24" rx="2"/>
      <rect x="851" y="189" width="7" height="44" rx="2"/>
      <rect x="866" y="176" width="7" height="70" rx="2"/>
      <rect x="881" y="193" width="7" height="36" rx="2"/>
      <rect x="896" y="203" width="7" height="16" rx="2"/>
    </g>
    <path d="M926 212H1124" stroke="#27272A" stroke-width="5" stroke-linecap="round"/>
    <path d="M926 212H1032" stroke="#FF6B35" stroke-width="5" stroke-linecap="round"/>
    <circle cx="1032" cy="212" r="7" fill="#FF6B35" filter="url(#glow)"/>
    <text x="926" y="244" fill="#71717A" font-family="Consolas, 'Courier New', monospace" font-size="12">02:41</text>
    <text x="1124" y="244" fill="#71717A" font-family="Consolas, 'Courier New', monospace" font-size="12" text-anchor="end">04:08</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="705" y="301" width="461" height="141" rx="10" fill="#0A0E12" stroke="#CAFF4A" stroke-opacity="0.7"/>
    <rect x="705" y="301" width="461" height="38" rx="10" fill="#14190E"/>
    <path d="M705 330H1166" stroke="#CAFF4A" stroke-opacity="0.3"/>
    <text x="727" y="325" fill="#CAFF4A" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="1.5">TAB GRAVEYARD</text>
    <text x="1142" y="325" fill="#FF9A72" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="end">47 OPEN</text>
    <g font-family="Consolas, 'Courier New', monospace" font-size="14">
      <text x="728" y="366" fill="#61DAFB">01</text>
      <text x="760" y="366" fill="#D4D4D8">docs</text>
      <text x="928" y="366" fill="#A855F7">03</text>
      <text x="960" y="366" fill="#D4D4D8">can-i-do-this</text>
      <text x="728" y="401" fill="#FF6B35">02</text>
      <text x="760" y="401" fill="#D4D4D8">one-more-idea</text>
      <text x="928" y="401" fill="#CAFF4A">04</text>
      <text x="960" y="401" fill="#D4D4D8">yes</text>
    </g>
  </g>

  <g font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700" letter-spacing="1.2">
    <text x="36" y="477" fill="#61DAFB">localhost:3000</text>
    <text x="250" y="477" fill="#A855F7">latency: 13ms</text>
    <text x="470" y="477" fill="#FF6B35">battery: 4%</text>
    <text x="684" y="477" fill="#CAFF4A">sleep: deferred</text>
    <text x="1164" y="477" fill="#71717A" text-anchor="end">press esc to pretend this never happened</text>
  </g>

  <rect width="1200" height="510" rx="18" fill="url(#scanlines)"/>
</svg>
