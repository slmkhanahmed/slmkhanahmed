<svg width="960" height="180" viewBox="0 0 960 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">After Hours — signal online</title>
  <desc id="description">A compact midnight radio panel. Large ivory lettering sits beside an oscilloscope where a violet packet travels along a cyan signal. Motion stops when reduced motion is preferred.</desc>
  <defs>
    <style>
      .packet { animation: packet-travel 6s linear infinite; }
      .carrier { animation: carrier-breathe 4s ease-in-out infinite; }
      @keyframes packet-travel {
        from { stroke-dashoffset: 540; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes carrier-breathe {
        0%, 100% { opacity: .5; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .packet, .carrier { animation: none; }
        .packet { stroke-dasharray: none; opacity: .6; }
      }
    </style>
    <linearGradient id="case" x1="0" y1="0" x2="960" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101018"/>
      <stop offset="1" stop-color="#090C13"/>
    </linearGradient>
    <linearGradient id="rail" x1="28" y1="164" x2="928" y2="164" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D3F76B"/>
      <stop offset=".3" stop-color="#65DEDD"/>
      <stop offset=".74" stop-color="#A98BFF"/>
      <stop offset="1" stop-color="#FF8C6F"/>
    </linearGradient>
    <pattern id="scope-grid" x="580" y="24" width="28" height="24" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V24" stroke="#77C9C9" stroke-opacity=".12"/>
    </pattern>
    <clipPath id="scope-clip">
      <rect x="580" y="24" width="348" height="124" rx="4"/>
    </clipPath>
    <filter id="soft-glow" x="-10%" y="-25%" width="120%" height="150%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <path id="wave" d="M586 94H624L638 78L652 109L669 49L689 127L708 76L726 94H752L767 83L782 105L799 64L817 117L836 85L850 94H922"/>
  </defs>

  <path d="M1 1H935L959 25V179H25L1 155V1Z" fill="url(#case)" stroke="#3B414E" stroke-width="2"/>
  <path d="M1 48V1H75M885 179H959V132" stroke="#70DBD8" stroke-width="2"/>
  <path d="M935 1V25H959" stroke="#A98BFF" stroke-width="2"/>
  <path d="M1 155H25V179" stroke="#A98BFF" stroke-width="2"/>

  <g fill="#746F84">
    <rect x="31" y="21" width="34" height="4"/>
    <rect x="70" y="21" width="13" height="4"/>
    <rect x="88" y="21" width="5" height="4"/>
  </g>
  <text x="30" y="92" fill="#F0EEE6" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="900" letter-spacing="-2">AFTER HOURS</text>
  <circle class="carrier" cx="42" cy="130" r="7" fill="#D3F76B"/>
  <circle cx="42" cy="130" r="12" stroke="#D3F76B" stroke-opacity=".25"/>
  <text x="66" y="139" fill="#D3F76B" font-family="Consolas, 'Courier New', monospace" font-size="27" font-weight="700" letter-spacing="2">SIGNAL ONLINE</text>

  <path d="M546 25V149" stroke="#3B414E"/>
  <path d="M542 25H550M542 149H550" stroke="#9492A4"/>
  <rect x="580" y="24" width="348" height="124" rx="4" fill="#060D14" stroke="#3E535F"/>
  <g clip-path="url(#scope-clip)">
    <rect x="580" y="24" width="348" height="124" fill="url(#scope-grid)"/>
    <path d="M580 86H928" stroke="#77C9C9" stroke-opacity=".18" stroke-dasharray="2 6"/>
    <use href="#wave" stroke="#65DEDD" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".65"/>
    <use href="#wave" class="packet" stroke="#C4A7FF" stroke-width="7" stroke-dasharray="80 460" stroke-dashoffset="270" stroke-linecap="round" filter="url(#soft-glow)" opacity=".7"/>
    <use href="#wave" class="packet" stroke="#E6D7FF" stroke-width="3" stroke-dasharray="80 460" stroke-dashoffset="270" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M591 36H609M591 36V48M917 136H899M917 136V124" stroke="#95DBD4" stroke-opacity=".7"/>
    <g fill="#D3F76B">
      <rect x="874" y="35" width="4" height="6"/>
      <rect x="882" y="32" width="4" height="9"/>
      <rect x="890" y="29" width="4" height="12"/>
    </g>
  </g>

  <path d="M31 163H928" stroke="url(#rail)" stroke-width="2"/>
  <path d="M509 160L503 167M519 160L513 167M529 160L523 167" stroke="#101018" stroke-width="3"/>
</svg>
