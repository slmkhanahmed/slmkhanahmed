<svg width="720" height="920" viewBox="0 0 720 920" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">The last tab mobile route</title>
  <desc id="description">A compact neon browser maze that wanders from enter through distraction, discovery, forgetting, keeping, and shipping before exit loops back to start.</desc>
  <defs>
    <linearGradient id="edge" x1="24" y1="20" x2="696" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#61DAFB"/><stop offset=".34" stop-color="#A855F7"/><stop offset=".69" stop-color="#FF6B35"/><stop offset="1" stop-color="#CAFF4A"/>
    </linearGradient>
    <linearGradient id="portal" x1="48" y1="410" x2="648" y2="542" gradientUnits="userSpaceOnUse">
      <stop stop-color="#61DAFB"/><stop offset=".5" stop-color="#A855F7"/><stop offset="1" stop-color="#FF6B35"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#FFFFFF" stroke-opacity=".04"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .route-flow { animation: route-travel 2.6s linear infinite; }
      .route-return { animation: route-travel 3.4s linear infinite reverse; }
      .portal-ring { animation: route-travel 3s linear infinite reverse; }
      .portal-pulse { animation: portal-breathe 3.2s ease-in-out infinite; }
      .status-live { animation: status-breathe 2.4s ease-in-out infinite; }
      @keyframes route-travel { to { stroke-dashoffset: -42; } }
      @keyframes portal-breathe { 0%, 100% { stroke-opacity: .65; } 50% { stroke-opacity: 1; } }
      @keyframes status-breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .route-flow, .route-return, .portal-ring, .portal-pulse, .status-live { animation: none !important; }
      }
    </style>
  </defs>
  <rect width="720" height="920" rx="20" fill="#07080D"/>
  <rect width="720" height="920" rx="20" fill="url(#grid)"/>
  <rect x="8" y="8" width="704" height="904" rx="14" stroke="url(#edge)" stroke-width="3"/>
  <path d="M28 118V30H692V118M28 844V892H148" stroke="#61DAFB" stroke-opacity=".2" stroke-width="2"/>
  <path d="M442 133H474V105H518V133H550V109H588V133H636" stroke="#A855F7" stroke-opacity=".35" stroke-width="3"/>
  <g font-family="Consolas, 'Courier New', monospace" font-weight="700">
    <circle cx="54" cy="49" r="7" fill="#FF6B35"/><circle cx="78" cy="49" r="7" fill="#F8D866"/><circle cx="102" cy="49" r="7" fill="#61DAFB"/>
    <text x="130" y="58" fill="#A1A1AA" font-size="26">LAST_TAB.HTML</text>
    <circle class="status-live" cx="586" cy="49" r="6" fill="#CAFF4A"/>
    <text x="666" y="58" fill="#CAFF4A" font-size="26" text-anchor="end">LIVE</text>
    <path d="M40 78H680" stroke="#FFFFFF" stroke-opacity=".14"/>
    <text x="48" y="119" fill="#E4E4E7" font-size="36" letter-spacing="1">THE LAST TAB</text>
    <text x="48" y="151" fill="#D8B4FE" font-size="28">DOES NOT CLOSE.</text>
    <path d="M82 202V410M82 542V826" stroke="url(#edge)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
    <path class="route-flow" d="M82 202V410M82 542V826" stroke="#07080D" stroke-width="3" stroke-dasharray="4 17"/>
    <path class="route-return" d="M82 826V877H678V202H414" stroke="#A855F7" stroke-opacity=".8" stroke-width="3" stroke-dasharray="11 10"/>
    <path d="M423 192L408 202L423 212" stroke="#D8B4FE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <circle cx="82" cy="202" r="18" fill="#07080D" stroke="#61DAFB" stroke-width="4"/>
      <path d="M77 194L89 202L77 210Z" fill="#61DAFB"/><path d="M100 202H130" stroke="#61DAFB" stroke-width="4"/>
      <rect x="130" y="174" width="266" height="56" rx="6" fill="#10151A" stroke="#61DAFB" stroke-width="2"/>
      <text x="150" y="214" fill="#61DAFB" font-size="36">ENTER</text>
      <text x="374" y="212" fill="#61DAFB" font-size="26" text-anchor="end">01</text>
    </g>
    <g>
      <circle cx="82" cy="276" r="12" fill="#A855F7"/><path d="M96 276H142" stroke="#A855F7" stroke-width="4"/>
      <rect x="142" y="246" width="494" height="60" rx="6" fill="#110D19" stroke="#A855F7" stroke-width="2"/>
      <rect x="142" y="256" width="4" height="40" fill="#A855F7"/>
      <text x="164" y="288" fill="#D8B4FE" font-size="36">GET DISTRACTED</text>
    </g>
    <g>
      <circle cx="82" cy="353" r="12" fill="#FF6B35"/><path d="M96 353H118" stroke="#FF6B35" stroke-width="4"/>
      <rect x="118" y="323" width="468" height="60" rx="6" fill="#19100D" stroke="#FF6B35" stroke-width="2"/>
      <text x="140" y="365" fill="#FF9A72" font-size="36">FIND SOMETHING</text>
      <path d="M606 344L617 355L606 366M629 344L640 355L629 366" stroke="#FF6B35" stroke-opacity=".65" stroke-width="3"/>
    </g>
    <rect class="portal-pulse" x="48" y="410" width="600" height="132" rx="10" fill="#0B0C13" stroke="url(#portal)" stroke-width="4"/>
    <rect class="portal-ring" x="60" y="422" width="576" height="108" rx="5" stroke="#A855F7" stroke-opacity=".75" stroke-width="2" stroke-dasharray="11 10"/>
    <path d="M77 449V437H102M619 449V437H594M77 503V515H102M619 503V515H594" stroke="#61DAFB" stroke-width="3"/>
    <text x="348" y="476" fill="#F4F4F5" font-size="44" text-anchor="middle" letter-spacing="1" filter="url(#glow)">YOU ARE HERE</text>
    <text x="348" y="511" fill="#CAFF4A" font-size="24" text-anchor="middle">MEMORY: SELECTIVE / CACHE: 99%</text>
    <g>
      <circle cx="82" cy="601" r="12" fill="#A855F7"/><path d="M96 601H154" stroke="#A855F7" stroke-width="4"/>
      <rect x="154" y="573" width="438" height="56" rx="6" fill="#171221" stroke="#A855F7" stroke-width="2"/>
      <rect x="154" y="573" width="54" height="56" rx="6" fill="#A855F7"/>
      <text x="181" y="613" fill="#07080D" font-size="36" text-anchor="middle">!</text>
      <text x="228" y="613" fill="#E4E4E7" font-size="36">FORGET WHY</text>
    </g>
    <g>
      <circle cx="82" cy="677" r="12" fill="#F8D866"/><path d="M96 677H130" stroke="#F8D866" stroke-width="4"/>
      <rect x="130" y="649" width="272" height="56" rx="6" fill="#17150C" stroke="#F8D866" stroke-width="2"/>
      <text x="152" y="689" fill="#F8D866" font-size="36">KEEP IT</text>
      <path d="M434 663H451V680H468V697M488 663V680H505V697H522" stroke="#F8D866" stroke-opacity=".3" stroke-width="3"/>
    </g>
    <g>
      <circle cx="82" cy="753" r="12" fill="#CAFF4A"/><path d="M96 753H142" stroke="#CAFF4A" stroke-width="4"/>
      <rect x="142" y="725" width="460" height="56" rx="6" fill="#11170D" stroke="#CAFF4A" stroke-width="2"/>
      <text x="164" y="765" fill="#CAFF4A" font-size="36">SHIP ANYWAY</text>
      <path d="M558 747L564 754L578 740" stroke="#CAFF4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g>
      <circle cx="82" cy="826" r="18" fill="#07080D" stroke="#FF6B35" stroke-width="4"/>
      <path d="M77 818L89 826L77 834Z" fill="#FF6B35"/><path d="M100 826H130" stroke="#FF6B35" stroke-width="4"/>
      <rect x="130" y="801" width="188" height="50" rx="6" fill="#19100D" stroke="#FF6B35" stroke-width="2"/>
      <text x="152" y="838" fill="#FF9A72" font-size="36">EXIT</text>
      <text x="346" y="835" fill="#A1A1AA" font-size="24">STILL ONE TAB OPEN.</text>
    </g>
    <rect x="262" y="857" width="366" height="40" rx="5" fill="#0E1018" stroke="#61DAFB" stroke-opacity=".65" stroke-width="2"/>
    <text x="445" y="886" fill="#61DAFB" font-size="30" text-anchor="middle">LOOP TO START ↗</text>
  </g>
</svg>
