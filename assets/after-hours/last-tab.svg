<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="last-tab-title last-tab-desc">
  <title id="last-tab-title">The last tab does not close</title>
  <desc id="last-tab-desc">A compact neon browser maze follows enter, get distracted, find something, a central you are here portal, forget why, keep it, ship anyway, and exit. The exit loops back to enter. Moving signals follow the route; reduced motion disables all animation.</desc>
  <defs>
    <radialGradient id="space" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(614 282) scale(606 346)">
      <stop stop-color="#181026"/><stop offset=".56" stop-color="#0A0C15"/><stop offset="1" stop-color="#07080D"/>
    </radialGradient>
    <linearGradient id="edge" x1="24" y1="20" x2="1176" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#61DAFB"/><stop offset=".34" stop-color="#A855F7"/><stop offset=".69" stop-color="#FF6B35"/><stop offset="1" stop-color="#CAFF4A"/>
    </linearGradient>
    <linearGradient id="portal" x1="430" y1="224" x2="802" y2="346" gradientUnits="userSpaceOnUse">
      <stop stop-color="#61DAFB"/><stop offset=".5" stop-color="#A855F7"/><stop offset="1" stop-color="#FF6B35"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#FFFFFF" stroke-opacity=".035"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L6 4L1 7" stroke="#D7E2F1" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .route-flow { animation: route-travel 2.6s linear infinite; }
      .route-return { animation: route-travel 3.4s linear infinite; }
      .portal-ring { animation: route-travel 3s linear infinite reverse; }
      .portal-pulse { animation: portal-breathe 3.2s ease-in-out infinite; }
      .status-live { animation: status-breathe 2.4s ease-in-out infinite; }
      @keyframes route-travel { to { stroke-dashoffset: -42; } }
      @keyframes portal-breathe { 0%, 100% { stroke-opacity: .65; } 50% { stroke-opacity: 1; } }
      @keyframes status-breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .route-flow, .route-return, .portal-ring, .portal-pulse, .status-live { animation: none !important; }
      }
    </style>
  </defs>

  <rect width="1200" height="520" rx="20" fill="url(#space)"/>
  <rect width="1200" height="520" rx="20" fill="url(#grid)"/>
  <rect x="8" y="8" width="1184" height="504" rx="14" stroke="url(#edge)" stroke-width="2"/>

  <g font-family="Consolas, 'Courier New', monospace" font-weight="700">
    <circle cx="40" cy="43" r="6" fill="#FF6B35"/><circle cx="61" cy="43" r="6" fill="#F8D866"/><circle cx="82" cy="43" r="6" fill="#61DAFB"/>
    <text x="112" y="53" fill="#E4E4E7" font-size="30" letter-spacing="1">THE LAST TAB</text>
    <text x="390" y="52" fill="#A1A1AA" font-size="22">DOES NOT CLOSE.</text>
    <circle class="status-live" cx="948" cy="43" r="5" fill="#CAFF4A"/>
    <text x="1160" y="51" fill="#CAFF4A" font-size="22" text-anchor="end">CURIOSITY: LIVE</text>
  </g>
  <path d="M32 77H1168" stroke="#FFFFFF" stroke-opacity=".14"/>

  <!-- Follow the bright route inward, then leave through the bottom row. -->
  <g stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M294 148H395" stroke="#61DAFB" stroke-opacity=".4"/>
    <path d="M744 148H829" stroke="#A855F7" stroke-opacity=".5"/>
    <path d="M991 188V208H838V285H806" stroke="#FF6B35" stroke-opacity=".5"/>
    <path d="M430 285H382" stroke="#A855F7" stroke-opacity=".6"/>
    <path d="M218 326V374" stroke="#F8D866" stroke-opacity=".6"/>
    <path d="M324 420H435" stroke="#F8D866" stroke-opacity=".5"/>
    <path d="M772 420H911" stroke="#CAFF4A" stroke-opacity=".5"/>
  </g>
  <g class="route-flow" stroke-width="3" stroke-dasharray="8 13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M294 148H386" stroke="#61DAFB"/>
    <path d="M744 148H820" stroke="#C798FF"/>
    <path d="M991 188V208H838V285H815" stroke="#FF9A72"/>
    <path d="M430 285H391" stroke="#C798FF"/>
    <path d="M218 326V365" stroke="#F8D866"/>
    <path d="M324 420H426" stroke="#F8D866"/>
    <path d="M772 420H902" stroke="#CAFF4A"/>
  </g>
  <path class="route-return" d="M1144 420H1166V484H34V148H51" stroke="#A855F7" stroke-opacity=".7" stroke-width="2" stroke-dasharray="11 10" stroke-linejoin="round" marker-end="url(#arrow)"/>

  <g font-family="Consolas, 'Courier New', monospace" font-weight="700" text-anchor="middle">
    <!-- The top row reads like three open browser tabs. -->
    <g>
      <rect x="58" y="108" width="236" height="80" rx="7" fill="#0D151C" stroke="#61DAFB" stroke-width="2"/>
      <path d="M59 132H293" stroke="#61DAFB" stroke-opacity=".3"/>
      <circle cx="74" cy="120" r="3" fill="#61DAFB"/><circle cx="86" cy="120" r="3" fill="#61DAFB" fill-opacity=".35"/>
      <path d="M270 117L276 123M276 117L270 123" stroke="#61DAFB" stroke-opacity=".5" stroke-width="2"/>
      <text x="176" y="169" fill="#61DAFB" font-size="32">ENTER</text>
    </g>
    <g>
      <rect x="400" y="108" width="344" height="80" rx="7" fill="#140F20" stroke="#A855F7" stroke-width="2"/>
      <path d="M401 132H743" stroke="#A855F7" stroke-opacity=".35"/>
      <circle cx="416" cy="120" r="3" fill="#A855F7"/><circle cx="428" cy="120" r="3" fill="#A855F7" fill-opacity=".35"/>
      <path d="M720 117L726 123M726 117L720 123" stroke="#A855F7" stroke-opacity=".6" stroke-width="2"/>
      <text x="572" y="169" fill="#D8B4FE" font-size="32">GET DISTRACTED</text>
    </g>
    <g>
      <rect x="836" y="108" width="310" height="80" rx="7" fill="#1A110E" stroke="#FF6B35" stroke-width="2"/>
      <path d="M837 132H1145" stroke="#FF6B35" stroke-opacity=".35"/>
      <circle cx="852" cy="120" r="3" fill="#FF6B35"/><circle cx="864" cy="120" r="3" fill="#FF6B35" fill-opacity=".35"/>
      <path d="M1122 117L1128 123M1128 117L1122 123" stroke="#FF6B35" stroke-opacity=".6" stroke-width="2"/>
      <text x="991" y="169" fill="#FF9A72" font-size="30">FIND SOMETHING</text>
    </g>

    <!-- The central portal is deliberately the only dominant object. -->
    <g aria-label="You are here portal">
      <rect class="portal-pulse" x="430" y="224" width="372" height="122" rx="12" fill="#0B0C13" stroke="url(#portal)" stroke-width="4"/>
      <rect class="portal-ring" x="442" y="236" width="348" height="98" rx="6" stroke="#A855F7" stroke-opacity=".8" stroke-width="2" stroke-dasharray="11 10"/>
      <path d="M457 258V250H477M775 258V250H755M457 312V320H477M775 312V320H755" stroke="#61DAFB" stroke-width="3"/>
      <text x="616" y="283" fill="#F4F4F5" font-size="38" filter="url(#glow)">YOU ARE HERE</text>
      <text x="616" y="313" fill="#CAFF4A" font-size="20">MEMORY: SELECTIVE</text>
    </g>
    <g>
      <rect x="60" y="246" width="316" height="80" rx="7" fill="#171221" stroke="#A855F7" stroke-width="2"/>
      <rect x="60" y="246" width="49" height="80" rx="7" fill="#A855F7"/>
      <text x="85" y="299" fill="#07080D" font-size="36">!</text>
      <text x="242" y="297" fill="#E4E4E7" font-size="30">FORGET WHY</text>
    </g>

    <g>
      <rect x="70" y="380" width="254" height="80" rx="7" fill="#18150C" stroke="#F8D866" stroke-width="2"/>
      <path d="M86 395H113M86 403H103" stroke="#F8D866" stroke-opacity=".45" stroke-width="2"/>
      <text x="197" y="432" fill="#F8D866" font-size="32">KEEP IT</text>
    </g>
    <g>
      <rect x="442" y="380" width="330" height="80" rx="7" fill="#11180D" stroke="#CAFF4A" stroke-width="2"/>
      <text x="589" y="432" fill="#CAFF4A" font-size="32">SHIP ANYWAY</text>
      <path d="M723 416L731 424L746 406" stroke="#CAFF4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g>
      <rect x="918" y="380" width="226" height="80" rx="7" fill="#19100D" stroke="#FF6B35" stroke-width="2"/>
      <text x="1012" y="432" fill="#FF9A72" font-size="32">EXIT</text>
      <path d="M1072 420H1102M1092 410L1102 420L1092 430" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- One quiet glitch: the exit has never actually been an exit. -->
    <path d="M900 278H924V258H948V292H974V270H999" stroke="#A855F7" stroke-opacity=".35" stroke-width="3"/>
    <text x="1000" y="325" fill="#A1A1AA" font-size="21">STILL ONE TAB OPEN.</text>
    <rect x="445" y="469" width="340" height="31" rx="4" fill="#0B0C13"/>
    <text x="615" y="492" fill="#C798FF" font-size="20" letter-spacing="1">EXIT REDIRECTS TO ENTER ↗</text>
  </g>
</svg>
