<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Chaos Zone</title>
  <desc id="desc">A neon warning banner announcing no minimalism beyond this point.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090014"/>
      <stop offset=".45" stop-color="#1b0638"/>
      <stop offset="1" stop-color="#050817"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset=".45" stop-color="#ff2bd6"/>
      <stop offset=".72" stop-color="#ffef00"/>
      <stop offset="1" stop-color="#ff5a1f"/>
    </linearGradient>
    <pattern id="warning" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="skewX(-18)">
      <rect width="22" height="44" fill="#ffef00"/>
      <rect x="22" width="22" height="44" fill="#0b0710"/>
    </pattern>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00f5ff" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="7" dy="7" stdDeviation="0" flood-color="#00f5ff"/>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="22" fill="url(#background)"/>
  <rect width="1200" height="260" rx="22" fill="url(#grid)"/>
  <path d="M0 0H1200V22H0zM0 238H1200V260H0z" fill="url(#warning)"/>

  <path d="M36 54h118l18 18-18 18H36L18 72z" fill="#ff2bd6"/>
  <text x="94" y="78" fill="#090014" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" text-anchor="middle">WARNING</text>

  <g transform="translate(1070 72) rotate(5)">
    <rect x="-92" y="-21" width="184" height="42" rx="6" fill="#ffef00" stroke="#090014" stroke-width="4"/>
    <text x="0" y="7" fill="#090014" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="900" text-anchor="middle">STATUS: LOUD</text>
  </g>

  <path d="M217 52l12 25 27 4-20 19 5 27-24-13-24 13 5-27-20-19 27-4z" fill="#ffef00" filter="url(#glow)"/>
  <path d="M1010 146l10 20 22 3-16 16 4 22-20-11-20 11 4-22-16-16 22-3z" fill="#00f5ff" filter="url(#glow)"/>
  <path d="M85 145l18 8-13 16 8 19-20 2-8 20-16-13-19 8-2-20-20-8 13-16-8-19 20-2 8-20 16 13 19-8 2 20z" fill="#ff5a1f"/>
  <path d="M1130 120l16 30 34 5-25 24 6 34-31-16-30 16 5-34-24-24 34-5z" fill="#ff2bd6"/>

  <g filter="url(#shadow)">
    <text x="600" y="137" fill="#fff" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="70" font-weight="900" letter-spacing="5" text-anchor="middle">CHAOS ZONE</text>
  </g>
  <rect x="312" y="153" width="576" height="5" rx="2.5" fill="url(#neon)" filter="url(#glow)"/>
  <text x="600" y="188" fill="#ffef00" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="900" letter-spacing="4" text-anchor="middle">NO MINIMALISM BEYOND THIS POINT</text>
  <text x="600" y="218" fill="#d7e6ff" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">GIFS  //  BUGS  //  BRIGHT PIXELS  //  QUESTIONABLE ENERGY</text>

  <g transform="translate(185 203) rotate(-7)">
    <rect x="-104" y="-18" width="208" height="36" rx="4" fill="#00f5ff" stroke="#090014" stroke-width="4"/>
    <text x="0" y="6" fill="#090014" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="900" text-anchor="middle">CTRL + ALT + CHAOS</text>
  </g>
  <g fill="none" stroke-linecap="square">
    <path d="M260 35h68M277 48h91" stroke="#00f5ff" stroke-width="6"/>
    <path d="M886 69h67M865 82h53" stroke="#ff2bd6" stroke-width="6"/>
    <path d="M930 208h88M955 221h104" stroke="#ffef00" stroke-width="6"/>
  </g>

  <rect x="3" y="3" width="1194" height="254" rx="19" fill="none" stroke="url(#neon)" stroke-width="6"/>
</svg>
