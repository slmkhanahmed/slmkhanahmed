    <rect x="790" y="104" width="346" height="178" rx="15" fill="url(#panel)"/>
    <path d="M790 140H1136" stroke="#22D3EE" stroke-opacity="0.24"/>
    <circle cx="812" cy="122" r="4" fill="#FB7185"/>
    <circle cx="828" cy="122" r="4" fill="#FBBF24"/>
    <circle cx="844" cy="122" r="4" fill="#34D399"/>
    <rect x="1022" y="113" width="92" height="18" rx="9" fill="#052E2B" stroke="#34D399" stroke-opacity="0.3"/>
    <circle cx="1034" cy="122" r="3" fill="#34D399"/>
    <text x="1105" y="126" fill="#6EE7B7" font-family="Consolas, monospace" font-size="9" font-weight="700" text-anchor="end">WORK / SYSTEMS</text>

    <rect x="812" y="155" width="302" height="34" rx="8" fill="#030712" stroke="#475569"/>
    <circle cx="830" cy="172" r="6" stroke="#94A3B8" stroke-width="1.6"/>
    <path d="M835 177L840 182" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"/>
    <text x="850" y="177" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="12">Search projects and systems...</text>

    <rect x="812" y="202" width="302" height="27" rx="6" fill="#0D192A" stroke="#1E293B"/>
    <rect x="812" y="202" width="3" height="27" rx="1.5" fill="#22D3EE"/>
    <circle cx="827" cy="215.5" r="4" fill="#22D3EE"/>
    <text x="840" y="220" fill="#E2E8F0" font-family="Consolas, monospace" font-size="11">ai-automation</text>
    <text x="1098" y="220" fill="#FDE68A" font-family="Consolas, monospace" font-size="11" text-anchor="end">&#9733;</text>

    <rect x="812" y="237" width="302" height="27" rx="6" fill="#0D192A" stroke="#1E293B"/>
    <rect x="812" y="237" width="3" height="27" rx="1.5" fill="#8B5CF6"/>
    <circle cx="827" cy="250.5" r="4" fill="#A78BFA"/>
    <text x="840" y="255" fill="#E2E8F0" font-family="Consolas, monospace" font-size="11">systems-integration</text>
    <text x="1098" y="255" fill="#FDE68A" font-family="Consolas, monospace" font-size="11" text-anchor="end">&#9733;</text>
  </g>

  <path d="M736 104V282" stroke="url(#accent)" stroke-width="2" stroke-dasharray="5 7"/>
  <circle cx="736" cy="104" r="5" fill="#22D3EE"/>
  <circle cx="736" cy="193" r="5" fill="#8B5CF6"/>
  <circle cx="736" cy="282" r="5" fill="#F472B6"/>
</svg>
