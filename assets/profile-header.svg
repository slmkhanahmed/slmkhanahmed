<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Salman Ahmed Khan — full-stack developer, AI automation builder, and systems integrator</title>
  <desc id="description">A colorful interface introducing Salman as a full-stack developer and technology leader.</desc>
  <defs>
    <linearGradient id="accent" x1="82" y1="50" x2="770" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#61DAFB"/>
      <stop offset="0.52" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#FF6B35"/>
    </linearGradient>
    <linearGradient id="panel" x1="800" y1="52" x2="1120" y2="286" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18181B"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#FFFFFF" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1200" height="330" rx="24" fill="#09090B"/>
  <rect width="1200" height="330" rx="24" fill="url(#grid)"/>
  <rect x="24" y="24" width="1152" height="282" rx="18" stroke="#FFFFFF" stroke-opacity="0.13"/>
  <path d="M24 86H1176" stroke="#FFFFFF" stroke-opacity="0.13"/>

  <circle cx="52" cy="55" r="6" fill="#FF6B35"/>
  <circle cx="72" cy="55" r="6" fill="#F8D866"/>
  <circle cx="92" cy="55" r="6" fill="#61DAFB"/>
  <text x="120" y="61" fill="#A1A1AA" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">PROFILE / SYSTEMS BUILDER</text>
  <text x="1146" y="61" fill="#71717A" font-family="Consolas, monospace" font-size="13" text-anchor="end">SAK.DEV</text>

  <rect x="52" y="116" width="11" height="128" rx="5.5" fill="url(#accent)"/>
  <text x="88" y="158" fill="#FAFAFA" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-2">SALMAN AHMED KHAN</text>
  <text x="91" y="195" fill="url(#accent)" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="1.2">FULL-STACK DEVELOPER  •  AI &amp; AUTOMATION</text>
  <text x="91" y="230" fill="#A1A1AA" font-family="Segoe UI, Arial, sans-serif" font-size="16">I build practical software, intelligent workflows, and reliable systems.</text>

  <g font-family="Consolas, monospace" font-size="12" font-weight="700">
    <rect x="91" y="254" width="76" height="28" rx="14" fill="#15242A" stroke="#61DAFB" stroke-opacity="0.55"/>
    <text x="129" y="273" fill="#61DAFB" text-anchor="middle">REACT</text>
    <rect x="177" y="254" width="112" height="28" rx="14" fill="#1A2033" stroke="#7AA2F7" stroke-opacity="0.55"/>
    <text x="233" y="273" fill="#9AB5FF" text-anchor="middle">TYPESCRIPT</text>
    <rect x="299" y="254" width="140" height="28" rx="14" fill="#261C31" stroke="#C084FC" stroke-opacity="0.55"/>
    <text x="369" y="273" fill="#D8B4FE" text-anchor="middle">AI / AUTOMATION</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="790" y="104" width="346" height="178" rx="15" fill="url(#panel)" stroke="#3F3F46"/>
    <path d="M790 140H1136" stroke="#3F3F46"/>
    <circle cx="812" cy="122" r="4" fill="#FF6B35"/>
    <circle cx="828" cy="122" r="4" fill="#F8D866"/>
    <circle cx="844" cy="122" r="4" fill="#61DAFB"/>
    <text x="1114" y="126" fill="#71717A" font-family="Consolas, monospace" font-size="10" text-anchor="end">WORK / SYSTEMS</text>

    <rect x="812" y="155" width="302" height="34" rx="8" fill="#09090B" stroke="#52525B"/>
