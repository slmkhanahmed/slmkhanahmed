    <path d="M835 177L840 182" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round"/>
    <text x="850" y="177" fill="#71717A" font-family="Segoe UI, Arial, sans-serif" font-size="12">Search projects and systems...</text>

    <rect x="812" y="202" width="302" height="27" rx="6" fill="#18181B"/>
    <circle cx="827" cy="215.5" r="4" fill="#61DAFB"/>
    <text x="840" y="220" fill="#E4E4E7" font-family="Consolas, monospace" font-size="11">ai-automation</text>
    <text x="1098" y="220" fill="#F8D866" font-family="Consolas, monospace" font-size="11" text-anchor="end">★</text>

    <rect x="812" y="237" width="302" height="27" rx="6" fill="#18181B"/>
    <circle cx="827" cy="250.5" r="4" fill="#A855F7"/>
    <text x="840" y="255" fill="#E4E4E7" font-family="Consolas, monospace" font-size="11">systems-integration</text>
    <text x="1098" y="255" fill="#F8D866" font-family="Consolas, monospace" font-size="11" text-anchor="end">★</text>
  </g>

  <path d="M736 104V282" stroke="url(#accent)" stroke-width="2" stroke-dasharray="5 7"/>
  <circle cx="736" cy="104" r="5" fill="#61DAFB"/>
  <circle cx="736" cy="193" r="5" fill="#A855F7"/>
  <circle cx="736" cy="282" r="5" fill="#FF6B35"/>
</svg>
