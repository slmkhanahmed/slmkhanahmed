<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Salman Ahmed Khan &#8212; full-stack developer, AI automation builder, and systems integrator</title>
  <desc id="description">A bright, professional interface introducing Salman as a full-stack developer and technology leader.</desc>
  <defs>
    <linearGradient id="background" x1="32" y1="18" x2="1168" y2="312" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.56" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="82" y1="50" x2="770" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284C7"/>
      <stop offset="0.52" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="panel" x1="800" y1="52" x2="1120" y2="286" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="panelTop" x1="790" y1="104" x2="1136" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#0F172A" stroke-opacity="0.045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="155%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#334155" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="330" rx="24" fill="url(#background)"/>
  <rect width="1200" height="330" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="328" rx="23" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="24" y="24" width="1152" height="282" rx="18" stroke="#94A3B8" stroke-opacity="0.42"/>
  <path d="M24 86H1176" stroke="#CBD5E1"/>

  <circle cx="52" cy="55" r="6" fill="#F43F5E"/>
  <circle cx="72" cy="55" r="6" fill="#F59E0B"/>
  <circle cx="92" cy="55" r="6" fill="#16A34A"/>
  <text x="120" y="61" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">PROFILE / SYSTEMS BUILDER</text>
  <rect x="1068" y="41" width="78" height="28" rx="14" fill="#E0F2FE" stroke="#7DD3FC"/>
  <circle cx="1084" cy="55" r="4" fill="#16A34A"/>
  <text x="1134" y="60" fill="#075985" font-family="Consolas, monospace" font-size="12" font-weight="700" text-anchor="end">SAK.DEV</text>

  <rect x="52" y="116" width="11" height="128" rx="5.5" fill="url(#accent)"/>
  <text x="88" y="158" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-2">SALMAN AHMED KHAN</text>
  <text x="91" y="195" fill="url(#accent)" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="1.2">FULL-STACK DEVELOPER  &#8226;  AI &amp; AUTOMATION</text>
  <text x="91" y="230" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="16">I build practical software, intelligent workflows, and reliable systems.</text>

  <g font-family="Consolas, monospace" font-size="12" font-weight="700">
    <rect x="91" y="254" width="76" height="28" rx="14" fill="#E0F2FE" stroke="#38BDF8"/>
    <text x="129" y="273" fill="#075985" text-anchor="middle">REACT</text>
    <rect x="177" y="254" width="112" height="28" rx="14" fill="#EEF2FF" stroke="#818CF8"/>
    <text x="233" y="273" fill="#3730A3" text-anchor="middle">TYPESCRIPT</text>
    <rect x="299" y="254" width="140" height="28" rx="14" fill="#F5F3FF" stroke="#A78BFA"/>
    <text x="369" y="273" fill="#6D28D9" text-anchor="middle">AI / AUTOMATION</text>
  </g>

