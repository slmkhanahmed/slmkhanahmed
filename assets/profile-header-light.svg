    <path d="M805 104H1121A15 15 0 0 1 1136 119V140H790V119A15 15 0 0 1 805 104Z" fill="url(#panelTop)"/>
    <path d="M790 140H1136" stroke="#CBD5E1"/>
    <circle cx="812" cy="122" r="4" fill="#F43F5E"/>
