    <circle cx="1035" cy="122" r="3" fill="#16A34A"/>
    <text x="1105" y="126" fill="#166534" font-family="Consolas, monospace" font-size="9" font-weight="700" text-anchor="end">WORK / SYSTEMS</text>

    <rect x="812" y="155" width="302" height="34" rx="8" fill="#F8FAFC" stroke="#94A3B8"/>
    <circle cx="830" cy="172" r="6" stroke="#475569" stroke-width="1.6"/>
    <path d="M835 177L840 182" stroke="#475569" stroke-width="1.6" stroke-linecap="round"/>
    <text x="850" y="177" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="12">Search projects and systems...</text>

    <rect x="812" y="202" width="302" height="27" rx="6" fill="#F1F5F9"/>
    <rect x="812" y="202" width="3" height="27" rx="1.5" fill="#0284C7"/>
    <circle cx="827" cy="215.5" r="4" fill="#0284C7"/>
    <text x="840" y="220" fill="#1E293B" font-family="Consolas, monospace" font-size="11">ai-automation</text>
    <text x="1098" y="220" fill="#B45309" font-family="Consolas, monospace" font-size="11" text-anchor="end">&#9733;</text>

    <rect x="812" y="237" width="302" height="27" rx="6" fill="#F1F5F9"/>
    <rect x="812" y="237" width="3" height="27" rx="1.5" fill="#4F46E5"/>
    <circle cx="827" cy="250.5" r="4" fill="#4F46E5"/>
    <text x="840" y="255" fill="#1E293B" font-family="Consolas, monospace" font-size="11">systems-integration</text>
    <text x="1098" y="255" fill="#B45309" font-family="Consolas, monospace" font-size="11" text-anchor="end">&#9733;</text>
  </g>

  <path d="M736 104V282" stroke="url(#accent)" stroke-width="2" stroke-dasharray="5 7"/>
  <circle cx="736" cy="104" r="5" fill="#0284C7"/>
  <circle cx="736" cy="193" r="5" fill="#4F46E5"/>
  <circle cx="736" cy="282" r="5" fill="#EA580C"/>
